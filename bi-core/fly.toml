app = "calla-bi-core"
primary_region = "iad"

[build]
  # Context is the packages/ root — the Dockerfile needs ../core-sdk/tsconfig.json.
  dockerfile = "bi-core/Dockerfile"
  context = ".."

[env]
  PORT = "4111"
  DATA_DIR = "/data"
  NODE_ENV = "production"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024

# Persistent state: seen-message ids, link cache, custom sources, usage caps.
[[mounts]]
  source = "bi-core-data"
  destination = "/data"
  type = "volume"

[[services]]
  internal_port = 4111
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
    protocol = "http"
    port = 4111
