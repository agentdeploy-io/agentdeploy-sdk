name: release-bi-core-image

# Builds and pushes the bi-core BYO-runtime image to GHCR (public package,
# anonymously pullable — the platform pulls it at provision time).
# Trigger: manual (Seller/Dev Dashboard → Actions → release-bi-core-image)
# or a tag push (bi-core-v1.1.0 → tag 1.1.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (semver, e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "bi-core-v*"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME#bi-core-v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z'):$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bi-core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=bi-core
          cache-to: type=gha,scope=bi-core,mode=max

      - name: Smoke-test the pushed image (Supervisor Protocol v1)
        run: |
          docker pull ${{ steps.meta.outputs.image }}
          docker run -d --name bicore-smoke -p 18080:8080 \
            -e PORT=8080 ${{ steps.meta.outputs.image }}
          for i in $(seq 1 30); do
            sleep 1
            curl -sf http://127.0.0.1:18080/health >/dev/null && break
          done
          curl -sf http://127.0.0.1:18080/health | grep -q '"status":"ok"'
          curl -sf -X POST http://127.0.0.1:18080/tasks \
            -d '{"taskType":"research_run","payload":{}}' | grep -q taskId
          # invalid task must be 400, not 500
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:18080/tasks -d '{}')
          [ "$CODE" = "400" ]
          echo "image conformance smoke passed"
