name: release-bi-core-image

# Builds and pushes the bi-core BYO-runtime image to GHCR (public package,
# anonymously pullable — the platform pulls it at provision time).
# Trigger: manual (Seller/Dev Dashboard → Actions → release-bi-core-image)
# or a tag push (bi-core-v1.1.0 → tag 1.1.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (semver, e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "bi-core-v*"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME#bi-core-v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z'):$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bi-core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=bi-core
          cache-to: type=gha,scope=bi-core,mode=max

      - name: Ensure public package visibility (platform pulls anonymously)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # Best-effort flip (GITHUB_TOKEN may lack package scopes on the org).
          set +e
          PKG_ID=$(gh api "orgs/agentdeploy-io/packages?package_type=container" \
            --jq '.packages[] | select(.name=="bi-core") | .id' 2>/dev/null)
          ENDPOINT="orgs/agentdeploy-io"
          if [ -z "$PKG_ID" ]; then
            PKG_ID=$(gh api "user/packages?package_type=container" \
              --jq '.packages[] | select(.name=="bi-core") | .id' 2>/dev/null)
            ENDPOINT="user"
          fi
          if [ -n "$PKG_ID" ]; then
            if gh api --method PATCH "${ENDPOINT}/packages/containers/${PKG_ID}" -f visibility=public >/dev/null 2>&1; then
              echo "package set public via API"
            else
              echo "::warning::could not set visibility via API — flip it manually: github.com/agentdeploy-io/packages → bi-core → Settings → Public"
            fi
          else
            echo "::warning::cannot list packages with GITHUB_TOKEN — set Public manually: github.com/agentdeploy-io/packages → bi-core → Settings → Public"
          fi
          set -e
          # Hard gate: the platform pulls anonymously — fail the release if that
          # does not work, so a private package can never reach a buyer.
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:agentdeploy-io/bi-core:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/agentdeploy-io/bi-core/manifests/${IMAGE_TAG}")
          if [ "$CODE" != "200" ]; then
            echo "::error::anonymous pull of bi-core:${IMAGE_TAG} returned ${CODE} — package must be public (github.com/agentdeploy-io/packages → bi-core → Settings → Public)"
            exit 1
          fi
          echo "anonymous pull verified"

      - name: Smoke-test the pushed image (Supervisor Protocol v1)
        run: |
          docker pull ${{ steps.meta.outputs.image }}
          docker run -d --name bicore-smoke -p 18080:8080 \
            -e PORT=8080 ${{ steps.meta.outputs.image }}
          for i in $(seq 1 30); do
            sleep 1
            curl -sf http://127.0.0.1:18080/health >/dev/null && break
          done
          curl -sf http://127.0.0.1:18080/health | grep -q '"status":"ok"'
          curl -sf -X POST http://127.0.0.1:18080/tasks \
            -d '{"taskType":"research_run","payload":{}}' | grep -q taskId
          # invalid task must be 400, not 500
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:18080/tasks -d '{}')
          [ "$CODE" = "400" ]
          echo "image conformance smoke passed"
