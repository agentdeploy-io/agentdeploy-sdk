name = "bi-edge"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "BI_EDGE", class_name = "BiEdgeAgent" },
  { name = "Supervisor", class_name = "Supervisor" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BiEdgeAgent"]

# Scheduling: the BiEdgeAgent DO self-ticks every 5 min via a self-
# perpetuating alarm and fires whichever stored schedules (settings table:
# cron:<name>, editable at runtime from the Calla UI) are due. No static
# Workers cron triggers — that's what makes crons UI-editable without
# redeploy.
